# Example only: copy or adapt this workflow before enabling it in a production repo.
name: Agent Policy PR Example

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  # Set this to "true" in your copied workflow if policy lookup failures should
  # block pull requests.
  AGENT_POLICY_FAIL_ON_REPORT: "false"

jobs:
  agent-policy:
    name: Agent Policy example report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build agent-policy
        run: cargo build --release -p agent-policy-cli

      - name: Collect changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

          base_commit="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=ACMR "$base_commit" HEAD > changed-files.txt

          {
            echo "count=$(wc -l < changed-files.txt | tr -d ' ')"
            echo "path=changed-files.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Run agent-policy example report
        id: agent-policy
        shell: bash
        run: |
          set +e

          binary="target/release/agent-policy"
          report="agent-policy-report.md"
          task="Review pull request changes"

          mapfile -t changed_files < changed-files.txt

          if [ "${#changed_files[@]}" -gt 0 ]; then
            "$binary" get \
              --repo . \
              --task "$task" \
              --type review \
              --files "${changed_files[@]}" \
              --format markdown > "$report" 2> agent-policy-error.log
          else
            "$binary" inspect \
              --repo . \
              --format markdown > "$report" 2> agent-policy-error.log
          fi

          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "# Agent Policy PR Example"
            echo
            echo "This is an example summary generated by \`agent-policy\`."
            echo
            echo "Changed files: ${#changed_files[@]}"
            echo
            if [ "${#changed_files[@]}" -gt 0 ]; then
              echo "<details><summary>Changed file list</summary>"
              echo
              sed 's/^/- `/' changed-files.txt | sed 's/$/`/'
              echo
              echo "</details>"
              echo
            fi

            if [ "$status" -eq 0 ]; then
              cat "$report"
            else
              echo "Agent Policy exited with status \`$status\`."
              echo
              echo '```text'
              cat agent-policy-error.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AGENT_POLICY_FAIL_ON_REPORT" = "true" ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi

