[workspace]
members = [
    "crates/agent-policy-cli",
    "crates/agent-policy-core",
    "crates/agent-policy-config",
    "crates/agent-policy-discover",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
walkdir = "2"
